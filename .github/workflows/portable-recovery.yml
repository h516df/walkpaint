name: Portable original signing recovery
on:
  workflow_dispatch:
    inputs:
      archive_base64:
        description: AES-256-GCM encrypted recovery archive only; never a plaintext key or password
        type: string
        required: true
permissions:
  contents: read
jobs:
  recovery:
    if: github.repository == 'h516df/walkpaint' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cloud-signing-prep-20261022')
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            cloud/RecoveryVerify.java
            release/signing-identity.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore original bytes in memory and verify private-key challenge
        env:
          ARCHIVE_BASE64: ${{ inputs.archive_base64 }}
          RECOVERY_KEY_BASE64: ${{ secrets.WALKPAINT_RECOVERY_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/recovery.aesgcm"
          trap 'rm -f "$archive"' EXIT
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"recovery.aesgcm").write_bytes(base64.b64decode(os.environ["ARCHIVE_BASE64"],validate=True))'
          java cloud/RecoveryVerify.java "$archive" release/signing-identity.json
