name: Cloud development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Prepare cloud toolchain
        run: bash .devcontainer/setup.sh
      - name: Check this revision
        run: bash cloud/check.sh
      - name: Preserve development APK and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-${{ github.sha }}
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.*
          retention-days: 3
          if-no-files-found: ignore
