name: Original signing readiness
on:
  workflow_dispatch:
    inputs:
      archive_base64:
        description: Optional AES-256-GCM encrypted recovery archive; empty runs signing checks
        type: string
        required: false
        default: ''
  push:
    branches: [codex/cloud-signing-prep-20261022]
permissions:
  contents: read
concurrency:
  group: original-signing-readiness
  cancel-in-progress: false
jobs:
  policy:
    if: inputs.archive_base64 == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s cloud -p test_sign_apk.py -v
  product:
    needs: policy
    if: github.repository == 'h516df/walkpaint' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cloud-signing-prep-20261022')
    environment: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Build isolated development APK without production configuration
        run: bash gradlew --no-daemon --max-workers=1 :app:assembleDebug -PwalkpaintDeveloperBuild=true
      - name: Build actual ARM64 unsigned product without signing credentials
        env:
          ORG_GRADLE_PROJECT_walkpaintAmapKey: ${{ secrets.WALKPAINT_AMAP_APPLICATION_KEY }}
        run: bash gradlew --no-daemon --max-workers=1 :app:assembleRelease -PwalkpaintArm64Only=true -PunsignedRelease=true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-inputs-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 3
  signing:
    needs: [policy, product]
    if: github.repository == 'h516df/walkpaint' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cloud-signing-prep-20261022')
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare public signing tools without private inputs
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: product-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/product-inputs
      - name: Sign actual product APK with original identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.WALKPAINT_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.WALKPAINT_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.WALKPAINT_KEY_PASSWORD }}
        run: |
          python3 cloud/sign_apk.py --input "$RUNNER_TEMP/product-inputs/release/app-release-unsigned.apk" --output "$RUNNER_TEMP/product-output/acceptance.apk" > "$RUNNER_TEMP/product-receipt.json"
          cat "$RUNNER_TEMP/product-receipt.json"
      - name: Preserve acceptance APK and public receipt (no release/channel update)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-product-${{ github.sha }}
          path: |
            ${{ runner.temp }}/product-output/acceptance.apk
            ${{ runner.temp }}/product-receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify rejection cases separately with a synthetic APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.WALKPAINT_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.WALKPAINT_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.WALKPAINT_KEY_PASSWORD }}
        run: python3 cloud/check_signing_readiness.py

  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_base64 != '' && github.repository == 'h516df/walkpaint' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cloud-signing-prep-20261022')
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            cloud/RecoveryVerify.java
            release/signing-identity.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore original bytes in memory and verify private-key challenge
        env:
          ARCHIVE_BASE64: ${{ inputs.archive_base64 }}
          RECOVERY_KEY_BASE64: ${{ secrets.WALKPAINT_RECOVERY_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/recovery.aesgcm"
          trap 'rm -f "$archive"' EXIT
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"recovery.aesgcm").write_bytes(base64.b64decode(os.environ["ARCHIVE_BASE64"],validate=True))'
          java cloud/RecoveryVerify.java "$archive" release/signing-identity.json
