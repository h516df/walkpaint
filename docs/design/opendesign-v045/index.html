<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>足迹涂色 · Android 界面原型</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="stage">
  <div class="app" id="app" data-od-id="app-shell">

    <!-- ============ 探索 / 地图 ============ -->
    <section class="screen map active" id="page-map" data-od-id="screen-explore" aria-label="探索">
      <div class="mapwrap" data-od-id="map-canvas-region">
        <canvas id="map-canvas" data-od-id="map-canvas" aria-label="足迹涂色地图"></canvas>
      </div>

      <div class="legend" id="legend" data-od-id="map-legend">
        <div class="row"><span class="sw walked"></span><span>已走过的地面</span></div>
        <div class="row"><span class="sw fog"></span><span>尚未探索</span></div>
      </div>

      <div class="float-col stack" data-od-id="map-controls">
        <button class="ctrl" id="zoom-in" data-od-id="ctrl-zoom-in" aria-label="放大">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="ctrl" id="zoom-out" data-od-id="ctrl-zoom-out" aria-label="缩小">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button class="ctrl" id="locate" data-od-id="ctrl-locate" aria-label="回到当前位置">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2"/></svg>
        </button>
      </div>

      <div class="overview" id="overview" data-od-id="explore-overview"></div>
      <div id="map-state"></div>
      <div id="map-slots"></div>
    </section>

    <!-- ============ 足迹 ============ -->
    <section class="screen" id="page-tracks" data-od-id="screen-tracks" aria-label="足迹">
      <div class="pagebody" id="tracks-body"></div>
    </section>

    <!-- ============ 我的 ============ -->
    <section class="screen" id="page-mine" data-od-id="screen-mine" aria-label="我的">
      <div class="pagebody" id="mine-body"></div>
    </section>

    <!-- ============ 当天详情 ============ -->
    <section class="screen" id="page-day" data-od-id="screen-day" aria-label="当天详情">
      <div class="subhead">
        <button class="back" id="day-back" aria-label="返回">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="day-title">当天详情</h2>
      </div>
      <div class="pagebody underbar" id="day-body"></div>
    </section>

    <!-- ============ 隐私与权限 ============ -->
    <section class="screen" id="page-privacy" data-od-id="screen-privacy" aria-label="隐私与权限">
      <div class="subhead">
        <button class="back" data-back aria-label="返回">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>隐私与权限</h2>
      </div>
      <div class="pagebody underbar" id="privacy-body"></div>
    </section>

    <!-- ============ 诊断 ============ -->
    <section class="screen" id="page-diag" data-od-id="screen-diagnostics" aria-label="诊断与更新">
      <div class="subhead">
        <button class="back" data-back aria-label="返回">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>诊断与更新</h2>
      </div>
      <div class="pagebody underbar" id="diag-body"></div>
    </section>

    <!-- ============ 顶部极简导航 ============ -->
    <nav class="topbar" id="nav" data-od-id="top-nav" aria-label="主导航">
      <div class="navseg" role="tablist">
        <button role="tab" data-nav="map" data-od-id="nav-explore" aria-selected="true">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.2 3.6 6.4v13.4L9 17.6l6 2.2 5.4-2.2V4.2L15 6.4z"/><path d="M9 4.2v13.4M15 6.4v13.4"/></svg>
          <span>探索</span>
        </button>
        <button role="tab" data-nav="tracks" data-od-id="nav-tracks" aria-selected="false">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20c-1.7 0-3-1.3-3-3s1.3-3 3-3h4"/><circle cx="18" cy="5" r="2.6"/><path d="M18 7.6V13c0 1.7-1.3 3-3 3h-3"/></svg>
          <span>足迹</span>
        </button>
        <button role="tab" data-nav="mine" data-od-id="nav-mine" aria-selected="false">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.7-3.6 3.7-5.6 7.2-5.6s6.5 2 7.2 5.6"/></svg>
          <span>我的</span>
        </button>
      </div>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/map.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
